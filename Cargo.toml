[package]
name = "script_lang"
version = "0.1.13"
edition = "2021"

[dependencies]
#parking_lot = "0.12.1"

[profile.release]
opt-level = 3
panic = "abort"
strip = true
lto = "fat"
codegen-units = 1
target-cpu = "native"

